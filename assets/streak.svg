<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Shantodotdev contribution streak">
<title>Shantodotdev contribution streak</title>
<style>
  :root{--bg:#ffffff;--border:#d0d7de;--title:#0969da;--text:#1f2328;--muted:#656d76;--accent:#0969da}
  @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--border:#30363d;--title:#58a6ff;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .title{font-size:16px;font-weight:600;fill:var(--title)}
  .label{font-size:13px;fill:var(--text)}
  .value{font-size:13px;font-weight:600;fill:var(--text)}
  .big{font-size:28px;font-weight:700;fill:var(--text)}
  .sub{font-size:12px;fill:var(--muted)}
  .name{font-size:13px;font-weight:600;fill:var(--accent)}
</style>
<rect x="0.5" y="0.5" width="494" height="209" rx="6" fill="var(--bg)" stroke="var(--border)"/>
<text x="25" y="35" class="title">Contribution Streak</text><text x="82" y="95" text-anchor="middle" class="big">14,612</text>
<text x="82" y="125" text-anchor="middle" class="name">Total Contributions</text>
<text x="82" y="147" text-anchor="middle" class="sub">2021 – Present</text><text x="247" y="95" text-anchor="middle" class="big">49</text>
<text x="247" y="125" text-anchor="middle" class="name">Current Streak</text>
<text x="247" y="147" text-anchor="middle" class="sub">09/30 – 11/17</text><text x="412" y="95" text-anchor="middle" class="big">49</text>
<text x="412" y="125" text-anchor="middle" class="name">Longest Streak</text>
<text x="412" y="147" text-anchor="middle" class="sub">09/30 – 11/17</text><line x1="165" y1="65" x2="165" y2="165" stroke="var(--border)"/><line x1="330" y1="65" x2="330" y2="165" stroke="var(--border)"/><text x="470" y="195" text-anchor="end" class="sub">Updated 2026-11-17</text>
</svg>
