<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Shantodotdev most used languages">
<title>Shantodotdev most used languages</title>
<style>
  :root{--bg:#ffffff;--border:#d0d7de;--title:#0969da;--text:#1f2328;--muted:#656d76;--accent:#0969da}
  @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--border:#30363d;--title:#58a6ff;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .title{font-size:16px;font-weight:600;fill:var(--title)}
  .label{font-size:13px;fill:var(--text)}
  .value{font-size:13px;font-weight:600;fill:var(--text)}
  .big{font-size:28px;font-weight:700;fill:var(--text)}
  .sub{font-size:12px;fill:var(--muted)}
  .name{font-size:13px;font-weight:600;fill:var(--accent)}
</style>
<rect x="0.5" y="0.5" width="494" height="209" rx="6" fill="var(--bg)" stroke="var(--border)"/>
<text x="25" y="35" class="title">Most Used Languages</text><clipPath id="r"><rect x="25" y="52" width="445" height="10" rx="5"/></clipPath><g clip-path="url(#r)"><rect x="25.00" y="52" width="326.42" height="10" fill="#3178c6"/><rect x="351.42" y="52" width="65.41" height="10" fill="#3572A5"/><rect x="416.83" y="52" width="15.86" height="10" fill="#f1e05a"/><rect x="432.69" y="52" width="14.73" height="10" fill="#dea584"/><rect x="447.42" y="52" width="5.77" height="10" fill="#4F5D95"/><rect x="453.19" y="52" width="4.84" height="10" fill="#00ADD8"/><rect x="458.03" y="52" width="11.97" height="10" fill="#8b949e"/></g><circle cx="30" cy="86" r="5" fill="#3178c6"/><text x="43" y="90" class="label">TypeScript</text><text x="175" y="90" class="sub">73.4%</text>
<circle cx="255" cy="86" r="5" fill="#3572A5"/><text x="268" y="90" class="label">Python</text><text x="400" y="90" class="sub">14.7%</text>
<circle cx="30" cy="112" r="5" fill="#f1e05a"/><text x="43" y="116" class="label">JavaScript</text><text x="175" y="116" class="sub">3.6%</text>
<circle cx="255" cy="112" r="5" fill="#dea584"/><text x="268" y="116" class="label">Rust</text><text x="400" y="116" class="sub">3.3%</text>
<circle cx="30" cy="138" r="5" fill="#4F5D95"/><text x="43" y="142" class="label">PHP</text><text x="175" y="142" class="sub">1.3%</text>
<circle cx="255" cy="138" r="5" fill="#00ADD8"/><text x="268" y="142" class="label">Go</text><text x="400" y="142" class="sub">1.1%</text>
</svg>
