<svg xmlns="http://www.w3.org/2000/svg" width="410" height="270" viewBox="0 0 410 270" role="img" aria-label="Shantodotdev contribution activity">
<title>Shantodotdev contribution activity</title>
<style>
  :root{--text:#1f2328;--muted:#59636e;--track:#d8dee4;--line:#d1d9e0;--c1:#1a7f37;--c2:#0969da;--c3:#bc4c00}
  @media (prefers-color-scheme: dark){:root{--text:#f0f6fc;--muted:#9da7b3;--track:#2b3340;--line:#30363d;--c1:#3fb950;--c2:#58a6ff;--c3:#f0883e}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
  .h{font-size:18px;font-weight:600;fill:var(--text)}
  .sub{font-size:14px;fill:var(--muted)}
  .lab{font-size:15px;font-weight:600;fill:var(--text)}
  .num{font-size:30px;font-weight:700;fill:var(--text)}
  .ring{font-size:28px;font-weight:700;fill:var(--text)}
  .leg{font-size:15px;fill:var(--text)}
</style>
<text x="10" y="28" class="h">Contribution Activity</text><text x="10" y="50" class="sub">14,614 contributions since 2021</text><circle cx="75" cy="140" r="46" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="75" cy="140" r="46" fill="none" stroke="var(--c1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="283.25 289.03" transform="rotate(-90 75 140)"/><text x="75" y="150" text-anchor="middle" class="ring">49</text><text x="75" y="220" text-anchor="middle" class="lab">Current streak</text><text x="75" y="240" text-anchor="middle" class="sub">Best: 50 days</text><circle cx="205" cy="140" r="46" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="205" cy="140" r="46" fill="none" stroke="var(--c2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="224.20 289.03" transform="rotate(-90 205 140)"/><text x="205" y="150" text-anchor="middle" class="ring">78%</text><text x="205" y="220" text-anchor="middle" class="lab">Active this year</text><text x="205" y="240" text-anchor="middle" class="sub">249 of 321 days</text><circle cx="335" cy="140" r="46" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="335" cy="140" r="46" fill="none" stroke="var(--c3)" stroke-width="10" stroke-linecap="round" stroke-dasharray="289.03 289.03" transform="rotate(-90 335 140)"/><text x="335" y="150" text-anchor="middle" class="ring">30</text><text x="335" y="220" text-anchor="middle" class="lab">Last 30 days</text><text x="335" y="240" text-anchor="middle" class="sub">days active</text>
</svg>
