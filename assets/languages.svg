<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Shantodotdev most used languages">
<title>Shantodotdev most used languages</title>
<style>
  :root{--bg:#ffffff;--border:#d0d7de;--title:#0969da;--text:#1f2328;--muted:#656d76;--accent:#0969da}
  @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--border:#30363d;--title:#58a6ff;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .title{font-size:16px;font-weight:600;fill:var(--title)}
  .label{font-size:13px;fill:var(--text)}
  .value{font-size:13px;font-weight:600;fill:var(--text)}
  .big{font-size:28px;font-weight:700;fill:var(--text)}
  .sub{font-size:12px;fill:var(--muted)}
  .name{font-size:13px;font-weight:600;fill:var(--accent)}
</style>
<rect x="0.5" y="0.5" width="494" height="209" rx="6" fill="var(--bg)" stroke="var(--border)"/>
<text x="25" y="35" class="title">Most Used Languages</text><clipPath id="r"><rect x="25" y="52" width="445" height="10" rx="5"/></clipPath><g clip-path="url(#r)"><rect x="25.00" y="52" width="254.30" height="10" fill="#3178c6"/><rect x="279.30" y="52" width="104.58" height="10" fill="#dea584"/><rect x="383.88" y="52" width="39.49" height="10" fill="#00ADD8"/><rect x="423.38" y="52" width="8.44" height="10" fill="#663399"/><rect x="431.81" y="52" width="7.92" height="10" fill="#f1e05a"/><rect x="439.73" y="52" width="7.74" height="10" fill="#c6538c"/><rect x="447.47" y="52" width="22.53" height="10" fill="#8b949e"/></g><circle cx="30" cy="86" r="5" fill="#3178c6"/><text x="43" y="90" class="label">TypeScript</text><text x="175" y="90" class="sub">57.1%</text>
<circle cx="255" cy="86" r="5" fill="#dea584"/><text x="268" y="90" class="label">Rust</text><text x="400" y="90" class="sub">23.5%</text>
<circle cx="30" cy="112" r="5" fill="#00ADD8"/><text x="43" y="116" class="label">Go</text><text x="175" y="116" class="sub">8.9%</text>
<circle cx="255" cy="112" r="5" fill="#663399"/><text x="268" y="116" class="label">CSS</text><text x="400" y="116" class="sub">1.9%</text>
<circle cx="30" cy="138" r="5" fill="#f1e05a"/><text x="43" y="142" class="label">JavaScript</text><text x="175" y="142" class="sub">1.8%</text>
<circle cx="255" cy="138" r="5" fill="#c6538c"/><text x="268" y="142" class="label">SCSS</text><text x="400" y="142" class="sub">1.7%</text>
</svg>
